<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyGenie - Tasks & Progress</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:linear-gradient(135deg,#f8f5ff,#ede6ff);
min-height:100vh;
padding:20px;
color:#2d1b4e;
}

.topbar{
background:white;
padding:15px 30px;
border-radius:20px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 8px 20px rgba(123,76,160,.12);
margin-bottom:25px;
}

.logo-area{
display:flex;
align-items:center;
gap:15px;
}

.logo{
width:55px;
height:55px;
object-fit:contain;
}

.logo-text h2{
color:#7b4ca0;
}

.logo-text p{
font-size:13px;
color:#777;
}

.dashboard-btn{
background:#7b4ca0;
color:white;
text-decoration:none;
padding:10px 20px;
border-radius:12px;
transition:.3s;
}

.dashboard-btn:hover{
background:#9360bb;
}

.container{
max-width:1300px;
margin:auto;
}

.stats-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
margin-bottom:25px;
}

.stat-card{
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 8px 20px rgba(123,76,160,.1);
text-align:center;
}

.stat-card h2{
color:#7b4ca0;
margin-bottom:5px;
}

.main-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-bottom:20px;
}

.card{
background:white;
padding:25px;
border-radius:25px;
box-shadow:0 8px 20px rgba(123,76,160,.1);
}

.card h2{
color:#7b4ca0;
margin-bottom:15px;
}

input,
select{
width:100%;
padding:12px;
margin-bottom:12px;
border:none;
background:#f5efff;
border-radius:12px;
}

button{
padding:10px 15px;
border:none;
border-radius:12px;
cursor:pointer;
background:#7b4ca0;
color:white;
transition:.3s;
}

button:hover{
background:#9360bb;
}

.add-btn{
width:100%;
}

.task-list{
margin-top:20px;
}

.task-item{
background:#f8f5ff;
padding:15px;
border-radius:15px;
margin-bottom:12px;
}

.task-item h4{
color:#5f3b8c;
margin-bottom:8px;
}

.task-buttons{
display:flex;
gap:8px;
margin-top:10px;
flex-wrap:wrap;
}

.progress-btn{
background:#ffb300;
}

.complete-btn{
background:#4caf50;
}

.delete-btn{
background:#ff5f7d;
}

.progress-container{
text-align:center;
}

.progress-circle{
width:180px;
height:180px;
border-radius:50%;
background:conic-gradient(
#7b4ca0 0deg,
#7b4ca0 0deg,
#ece6ff 0deg
);
display:flex;
align-items:center;
justify-content:center;
margin:auto;
}

.circle-inner{
width:140px;
height:140px;
background:white;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
}

.circle-inner h1{
color:#7b4ca0;
}

.subject-card{
margin-top:20px;
}

.subject-item{
margin-bottom:15px;
}

.progress-bar{
height:10px;
background:#ece6ff;
border-radius:10px;
overflow:hidden;
}

.progress-fill{
height:100%;
background:#7b4ca0;
}

.filter-buttons{
margin-bottom:15px;
display:flex;
gap:10px;
flex-wrap:wrap;
}

.filter-btn.active{
background:#5f3b8c;
}

@media(max-width:900px){

.stats-grid{
grid-template-columns:1fr 1fr;
}

.main-grid{
grid-template-columns:1fr;
}

}
</style>
</head>

<body>

<div class="container">

<div class="topbar">

<div class="logo-area">

<img src="1.png" class="logo">

<div class="logo-text">
<h2>StudyGenie</h2>
<p>Smart Learning Assistant</p>
</div>

</div>

<a href="dashboard.html" class="dashboard-btn">
Dashboard
</a>

</div>

<div class="stats-grid">

<div class="stat-card">
<h2 id="totalTasks">0</h2>
<p>Total Tasks</p>
</div>

<div class="stat-card">
<h2 id="pendingTasks">0</h2>
<p>Pending</p>
</div>

<div class="stat-card">
<h2 id="progressTasks">0</h2>
<p>In Progress</p>
</div>

<div class="stat-card">
<h2 id="completedTasks">0</h2>
<p>Completed</p>
</div>

</div>

<div class="main-grid">

<div class="card">

<h2>Add New Task</h2>

<input type="text" id="taskName" placeholder="Task Name">

<input type="text" id="subject" placeholder="Subject">

<input type="date" id="taskDate">

<select id="priority">
<option>Low</option>
<option selected>Medium</option>
<option>High</option>
</select>

<button class="add-btn" onclick="addTask()">
+ Add Task
</button>

</div>

<div class="card progress-container">

<h2>Overall Progress</h2>

<div class="progress-circle" id="progressCircle">

<div class="circle-inner">

<h1 id="progressPercent">0%</h1>

<p>Completed</p>

</div>

</div>

</div>

</div>

<div class="card">

<h2>My Tasks</h2>

<div class="filter-buttons">

<button class="filter-btn active" onclick="setFilter('All',this)">All</button>

<button class="filter-btn" onclick="setFilter('Pending',this)">Pending</button>

<button class="filter-btn" onclick="setFilter('In Progress',this)">In Progress</button>

<button class="filter-btn" onclick="setFilter('Completed',this)">Completed</button>

</div>

<div id="taskList"></div>

</div>

<div class="card subject-card">

<h2>Subject Wise Progress</h2>

<div id="subjectProgress"></div>

</div>

</div>

<script>

let tasks =
JSON.parse(localStorage.getItem("tasks")) || [];

let currentFilter = "All";

function saveTasks(){
localStorage.setItem(
"tasks",
JSON.stringify(tasks)
);
}

function addTask(){

const taskName =
document.getElementById("taskName").value;

const subject =
document.getElementById("subject").value;

const taskDate =
document.getElementById("taskDate").value;

const priority =
document.getElementById("priority").value;

if(taskName==="" || subject===""){
alert("Fill all fields");
return;
}

tasks.push({
taskName,
subject,
taskDate,
priority,
status:"Pending"
});

saveTasks();

document.getElementById("taskName").value="";
document.getElementById("subject").value="";
document.getElementById("taskDate").value="";

renderTasks();
}

function deleteTask(index){

tasks.splice(index,1);

saveTasks();

renderTasks();

}

function markInProgress(index){

tasks[index].status="In Progress";

saveTasks();

renderTasks();

}

function markCompleted(index){

tasks[index].status="Completed";

saveTasks();

renderTasks();

}

function renderTasks(){

const taskList =
document.getElementById("taskList");

taskList.innerHTML="";

let filtered = tasks;

if(currentFilter!=="All"){

filtered =
tasks.filter(task =>
task.status===currentFilter
);

}

filtered.forEach(task=>{

const originalIndex =
tasks.indexOf(task);

taskList.innerHTML += `

<div class="task-item">

<h4>${task.taskName}</h4>

<p><b>Subject:</b> ${task.subject}</p>

<p><b>Date:</b> ${task.taskDate}</p>

<p><b>Priority:</b> ${task.priority}</p>

<p><b>Status:</b> ${task.status}</p>

<div class="task-buttons">

<button class="progress-btn"
onclick="markInProgress(${originalIndex})">
🔄 In Progress
</button>

<button class="complete-btn"
onclick="markCompleted(${originalIndex})">
✅ Completed
</button>

<button class="delete-btn"
onclick="deleteTask(${originalIndex})">
🗑 Delete
</button>

</div>

</div>

`;

});

updateStats();
updateProgressCircle();
updateSubjectProgress();

}

function updateStats(){

document.getElementById("totalTasks").innerText =
tasks.length;

document.getElementById("pendingTasks").innerText =
tasks.filter(t=>t.status==="Pending").length;

document.getElementById("progressTasks").innerText =
tasks.filter(t=>t.status==="In Progress").length;

document.getElementById("completedTasks").innerText =
tasks.filter(t=>t.status==="Completed").length;

}

function updateProgressCircle(){

const total = tasks.length;

const completed =
tasks.filter(t=>t.status==="Completed").length;

const percent =
total===0 ? 0 :
Math.round((completed/total)*100);

document.getElementById("progressPercent")
.innerText = percent + "%";

document.getElementById("progressCircle")
.style.background =
`conic-gradient(
#7b4ca0 ${percent*3.6}deg,
#ece6ff ${percent*3.6}deg
)`;

}

function updateSubjectProgress(){

const container =
document.getElementById("subjectProgress");

container.innerHTML="";

const subjects = {};

tasks.forEach(task=>{

if(!subjects[task.subject]){

subjects[task.subject] = {
total:0,
completed:0
};

}

subjects[task.subject].total++;

if(task.status==="Completed"){
subjects[task.subject].completed++;
}

});

for(let subject in subjects){

const percent =
Math.round(
(subjects[subject].completed /
subjects[subject].total)*100
);

container.innerHTML += `

<div class="subject-item">

<p><b>${subject}</b> (${percent}%)</p>

<div class="progress-bar">

<div class="progress-fill"
style="width:${percent}%">
</div>

</div>

</div>

`;

}

}

function setFilter(filter,btn){

currentFilter = filter;

document
.querySelectorAll(".filter-btn")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

renderTasks();

}

renderTasks();

</script>

</body>
</html>
