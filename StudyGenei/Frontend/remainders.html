<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyGenie - Reminder Settings</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#f8f5ff,#ede6ff);
    min-height:100vh;
    color:#2d1b4e;
}

/* Top Bar */
.topbar{
    background:white;
    padding:15px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 4px 15px rgba(123,76,160,0.15);
}

.logo-section{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:55px;
    height:55px;
    object-fit:contain;
}

.logo-text h2{
    color:#7b4ca0;
}

.logo-text p{
    font-size:13px;
    color:#777;
}

.dashboard-btn{
    background:#7b4ca0;
    color:white;
    text-decoration:none;
    padding:12px 18px;
    border-radius:12px;
    transition:.3s;
}

.dashboard-btn:hover{
    background:#9360bb;
}

/* Container */

.container{
    width:90%;
    max-width:1200px;
    margin:30px auto;
}

.page-title{
    text-align:center;
    margin-bottom:25px;
}

.page-title h1{
    color:#5f3b8c;
    margin-bottom:10px;
}

/* Stats */

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:25px;
}

.stat-card{
    background:white;
    border-radius:20px;
    padding:20px;
    text-align:center;
    box-shadow:0 10px 20px rgba(123,76,160,.12);
}

.stat-card h2{
    color:#7b4ca0;
    font-size:32px;
}

/* Form */

.card{
    background:white;
    padding:25px;
    border-radius:25px;
    box-shadow:0 10px 20px rgba(123,76,160,.12);
    margin-bottom:25px;
}

.card h2{
    color:#7b4ca0;
    margin-bottom:20px;
}

input,select{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:none;
    border-radius:12px;
    background:#f5efff;
}

button{
    border:none;
    cursor:pointer;
}

.primary-btn{
    width:100%;
    padding:13px;
    background:#7b4ca0;
    color:white;
    border-radius:12px;
    font-size:15px;
}

.primary-btn:hover{
    background:#9360bb;
}

/* Reminder Lists */

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

.reminder-card{
    background:#f8f5ff;
    padding:15px;
    border-radius:15px;
    margin-top:15px;
}

.reminder-card h4{
    color:#5f3b8c;
    margin-bottom:8px;
}

.priority{
    display:inline-block;
    margin-top:8px;
    padding:5px 10px;
    border-radius:8px;
    color:white;
    font-size:12px;
}

.high{
    background:#ff5c7a;
}

.medium{
    background:#ffb347;
}

.low{
    background:#6cc070;
}

.action-buttons{
    margin-top:12px;
    display:flex;
    gap:10px;
}

.complete-btn{
    flex:1;
    background:#6cc070;
    color:white;
    padding:10px;
    border-radius:10px;
}

.delete-btn{
    flex:1;
    background:#ff5c7a;
    color:white;
    padding:10px;
    border-radius:10px;
}

.empty{
    text-align:center;
    color:#777;
    margin-top:15px;
}

@media(max-width:900px){
    .grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header class="topbar">

<div class="logo-section">
<img src="1.png" class="logo">

<div class="logo-text">
<h2>StudyGenie</h2>
<p>Smart Learning Assistant</p>
</div>
</div>

<a href="dashboard.html" class="dashboard-btn">
← Dashboard
</a>

</header>

<div class="container">

<div class="page-title">
<h1>⏰ Reminder Settings</h1>
<p>Never miss an assignment, task or exam.</p>
</div>

<!-- Stats -->

<div class="stats">

<div class="stat-card">
<h2 id="totalCount">0</h2>
<p>Total Reminders</p>
</div>

<div class="stat-card">
<h2 id="pendingCount">0</h2>
<p>Pending</p>
</div>

<div class="stat-card">
<h2 id="completedCount">0</h2>
<p>Completed</p>
</div>

</div>

<!-- Add Reminder -->

<div class="card">

<h2>Add Reminder</h2>

<input type="text"
id="title"
placeholder="Reminder Title">

<select id="type">
<option>📚 Study Session</option>
<option>📝 Assignment</option>
<option>🎯 Task</option>
<option>📅 Exam</option>
<option>⏰ Pomodoro</option>
</select>

<input type="date" id="date">

<input type="time" id="time">

<select id="priority">
<option>Low</option>
<option selected>Medium</option>
<option>High</option>
</select>

<button class="primary-btn" onclick="addReminder()">
+ Add Reminder
</button>

</div>

<div class="grid">

<!-- Pending -->

<div class="card">

<h2>Pending Reminders</h2>

<div id="pendingList"></div>

</div>

<!-- Completed -->

<div class="card">

<h2>Completed Reminders</h2>

<div id="completedList"></div>

</div>

</div>

</div>

<script>

let reminders =
JSON.parse(localStorage.getItem("reminders")) || [];

function saveData(){
    localStorage.setItem(
        "reminders",
        JSON.stringify(reminders)
    );
}

function addReminder(){

    const title =
    document.getElementById("title").value;

    const type =
    document.getElementById("type").value;

    const date =
    document.getElementById("date").value;

    const time =
    document.getElementById("time").value;

    const priority =
    document.getElementById("priority").value;

    if(title === "" || date === "" || time === ""){
        alert("Please fill all fields");
        return;
    }

    reminders.push({
        title,
        type,
        date,
        time,
        priority,
        completed:false
    });

    saveData();

    document.getElementById("title").value="";
    document.getElementById("date").value="";
    document.getElementById("time").value="";

    renderReminders();
}

function renderReminders(){

    const pending =
    document.getElementById("pendingList");

    const completed =
    document.getElementById("completedList");

    pending.innerHTML="";
    completed.innerHTML="";

    let pendingCount=0;
    let completedCount=0;

    reminders.forEach((r,index)=>{

        let card = `
        <div class="reminder-card">

        <h4>${r.title}</h4>

        <p>${r.type}</p>

        <p>${r.date}</p>

        <p>${r.time}</p>

        <span class="priority ${r.priority.toLowerCase()}">
        ${r.priority}
        </span>
        `;

        if(!r.completed){

            pendingCount++;

            card += `
            <div class="action-buttons">

            <button class="complete-btn"
            onclick="completeReminder(${index})">
            Complete
            </button>

            <button class="delete-btn"
            onclick="deleteReminder(${index})">
            Delete
            </button>

            </div>
            </div>
            `;

            pending.innerHTML += card;

        }else{

            completedCount++;

            card += `
            <div class="action-buttons">

            <button class="delete-btn"
            onclick="deleteReminder(${index})">
            Delete
            </button>

            </div>
            </div>
            `;

            completed.innerHTML += card;
        }
    });

    if(pending.innerHTML===""){
        pending.innerHTML=
        "<p class='empty'>No pending reminders.</p>";
    }

    if(completed.innerHTML===""){
        completed.innerHTML=
        "<p class='empty'>No completed reminders.</p>";
    }

    document.getElementById("totalCount").innerText=
    reminders.length;

    document.getElementById("pendingCount").innerText=
    pendingCount;

    document.getElementById("completedCount").innerText=
    completedCount;
}

function completeReminder(index){

    reminders[index].completed=true;

    saveData();

    renderReminders();
}

function deleteReminder(index){

    reminders.splice(index,1);

    saveData();

    renderReminders();
}

renderReminders();

</script>

</body>
</html>
